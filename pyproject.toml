[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mrscraper_mcp*"]

[project]
name = "MrScraper-MCP"
version = "0.0.1"
description = "MrScraper MCP Server"
authors = [
    { name = "Benedictus Visto Kartika", email = "visto@mrscraper.com" },
]
readme = "README.md"
license = { text = "CC" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastmcp==2.14.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.1"
]

[project.optional-dependencies]
dev = ["ruff==0.14.1"]