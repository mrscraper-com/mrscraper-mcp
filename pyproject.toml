[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mrscraper_mcp*"]

[project]
name = "MrScraper-MCP"
version = "0.1.0"
description = "MrScraper MCP Server"
authors = [
    { name = "Benedictus Visto Kartika", email = "visto@mrscraper.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "beautifulsoup4==4.13.4",
    "fastmcp==3.4.7",
    "httpx==0.28.1",
    "markdownify==1.1.0",
    "python-dotenv==1.2.1"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.14.1"]

[project.scripts]
mrscraper-mcp = "mrscraper_mcp.main:run"
