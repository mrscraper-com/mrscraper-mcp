name: Deploy mcp

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/mrscraper-wheel .

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Build + Deploy
        run: |
          ssh gthost-langgraph-dev << 'EOF'
            export COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            export TAG=registry.mrbrowser.com/mrscraper-mcp:$COMMIT_SHA
            export COMPOSE="-f compose.yaml"

            echo $TAG

            cd /home/ubuntu/mrscraper-mcp/docker
            git fetch
            git reset --hard
            git checkout $COMMIT_SHA

            docker compose $COMPOSE build
            docker tag docker-mrscraper-mcp:latest $TAG
            docker push $TAG
          EOF

          ssh kubernetes << 'EOF'
            export COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            export TAG=registry.mrbrowser.com/mrscraper-mcp:$COMMIT_SHA
            export COMPOSE="compose.yaml"

            kubectl set image deploy/mrscraper-mcp mrscraper-mcp=$TAG
            kubectl rollout status deploy/mrscraper-mcp
          EOF
