name: Deploy mcp

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build --tag mrscraper-mcp:test -f docker/Dockerfile .

      - name: Verify npm package
        run: npm pack --dry-run

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Build + Deploy
        run: |
          ssh gthost-langgraph-dev << 'EOF'
            export COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            export TAG=registry.mrbrowser.com/mrscraper-mcp:$COMMIT_SHA
            export COMPOSE="-f compose.yaml"

            echo $TAG

            cd /home/ubuntu/mrscraper-mcp/docker
            git fetch
            git reset --hard
            git checkout $COMMIT_SHA

            docker compose $COMPOSE build
            docker tag docker-mrscraper-mcp:latest $TAG
            docker push $TAG
          EOF

          ssh kubernetes << 'EOF'
            export COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            export TAG=registry.mrbrowser.com/mrscraper-mcp:$COMMIT_SHA
            export COMPOSE="compose.yaml"

            kubectl set image deploy/mrscraper-mcp mrscraper-mcp=$TAG
            kubectl rollout status deploy/mrscraper-mcp
          EOF
