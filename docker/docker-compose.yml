version: '3.8'

services:
  mrscraper-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrscraper-mcp
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - TRANSPORT=http
    restart: unless-stopped
    networks:
      - mrscraper-network

networks:
  mrscraper-network:
    driver: bridge
